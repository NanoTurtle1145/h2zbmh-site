function showLinksSelect(eleId, siteTopicCode,completeCallback) {
	SiteService.getSiteLinks(siteTopicCode,'',100,null,null,null, function(res) {
		if (res.responseCode != 0) {
			return;
		}else{
			var htmlarea = '';
			var arr = $.parseJSON(res.responseText).rows;
			if(arr.length>0){
				htmlarea = '<a style="" id="'+eleId+'_a" href=\'javascript:linkCallback("'+eleId+'")\' >'+arr[0].field3+'</a>';
			}else{
				htmlarea = '<a style="" id="'+eleId+'_a" href=\'javascript:linkCallback("'+eleId+'")\' ></a>';
			}
			htmlarea += '<ul class="mcsLink" id="'+eleId+'_ul">';
			for ( var i = 0; i < arr.length; i++) {
				if(arr[i].field4 != null && arr[i].field4.length != 0){
					htmlarea += '<li onclick=\'$("#'+eleId+'_ul").toggle();window.open("'+arr[i].field4+'");\'>'+arr[i].field3+'</li>';
				}else{
				//	htmlarea += '<li onclick=\'$("#'+eleId+'_ul").toggle();\'>'+arr[i].field3+'</li>';
				}
			}
			htmlarea += '</ul>';
			
			$('#' + eleId).html(htmlarea);
		}
		
		if( completeCallback!=null ) completeCallback(eleId);
	});
}
function linkCallback(eleId){
	$("#"+eleId+"_ul").toggle();
	$(".mcsLink:not(#"+eleId+"_ul)").hide();
}
</script>

<script style="text/javascript">
var gItemsPerpage = 25;
var gCurrentPage = 0;

$(document).ready(function() {
	javascript:dwr.engine.setAsync(false);

	loadByTopic1( $("#siteTopicCode").val() );
	$(".fancybox").fancybox({
		openEffect	: 'none',
		closeEffect	: 'none'
	});
	
});	
function loadByTopic1(siteTopicCode){
	SiteService.getSiteTopicAttr(siteTopicCode,"parent", function(res){
		if (res.responseCode != 0) {
			mcsShowSubtopicList("subtopics",siteTopicCode);
			mcsShowTopicAttr("topicpath",siteTopicCode,"fullname",null);
			showArticleList( siteTopicCode );
		}else{
			$('#topicpath').html(res.responseParam1);
			mcsShowSubtopicList("subtopics",res.responseText);
		}
		//设置左侧菜单选中前和选中后的样式
		$("#subtopics").find("li").click(function(){
		 // $("#subtopics").find("li").children("span").css("color","#3677ce");
		//  $(this).children("span").css("backgroundColor","#e1e1e1");
		  $("#subtopics").find("li").removeClass().addClass("sub_unselect");
		  $(this).removeClass().addClass("sub_select");
		 
		  
		
		  showArticleList( $(this).attr("rel") );//生成二级页面右侧文章列表的函数
		  var topicCode = $("#selectedTopicCode").val(); 
		  
		  if ($("#pathbar2").text().indexOf("名师团队")>0){
		  	
		    $("#pathbar2").text(" 名师团队(区县综合荣誉及以上)")
		}
		  		
		});

		var b = false;
		$("#subtopics li").each(function() {

			if( $(this).attr("rel") == siteTopicCode ){
				b = true;
				$(this).click();
			}
		});
		if( !b ) $("#subtopics li").first().click();
	});	
}
function showArticleList(topicCode){
	$("#selectedTopicCode").val(topicCode);
	SiteService.getSiteTopicAttr(topicCode,"fullname", function(res){
		var htmlarea = "<li>您现在的位置&nbsp;:&nbsp;"+res.responseText+"</li>";
		$('#pathbar').html(htmlarea);
		
		var htmlarea1 = res.responseText.split(" ")[0];
		$('#pathbar1').html(htmlarea1);
		
		var htmlarea2 = res.responseText.split(">")[2];
		$('#pathbar2').html(htmlarea2);
	});		
	pageClickCallback(0,null);
}
function articlesCompleteCallback(items){
	musShowPaging("light-pagination",items,gItemsPerpage,gCurrentPage,pageClickCallback);
}

/* 改变文章列表样式 */	
function pageClickCallback(pageNumber, event){
	gCurrentPage = pageNumber;
	
	var offset = gItemsPerpage * (pageNumber-1);
	if( offset<0 ) offset = 0;
	var topicCode = $("#selectedTopicCode").val();
	
	gItemsPerpage = 10;
	if( topicCode == '2d9ecea87fdb48daafb9268ab4ad2c05' ){		
		gItemsPerpage = 10;//每页显示列表的条数
		$("#atclist1").removeClass().addClass("mcsGallery");
		//图片平铺
		mcsShowTeaserGallery("atclist1",topicCode,offset,gItemsPerpage,"article",150,"/mecbmh",null,null,articlesCompleteCallback);
	}else if( topicCode == '' || topicCode == '68bfa9d643ba43e7ba1fc615489f4c67' ){		//校园风采id
		gItemsPerpage = 16;//每页显示列表的条数
		$("#atclist1").removeClass().addClass("mcsGallery");
		//图片栏目
		Gallery("atclist1",topicCode,offset,gItemsPerpage,"article",150,"/mecbmh",null,null,articlesCompleteCallback);
	}else if( topicCode == '' ){
		$("#atclist1").removeClass().addClass("mcsList");
		mcsShowAttachmentList("atclist1",topicCode,offset,gItemsPerpage,"/mecbmh",true,30,articlesCompleteCallback);
	}else{
		$("#atclist1").removeClass().addClass("mcsList");
		ShowPagingArticleList("atclist1",topicCode,offset,gItemsPerpage,"article",true,30,null,null,null,articlesCompleteCallback);
		
	}		
}
function ShowPagingArticleList(eleId,siteTopicCode,offset,size,pageurl,btime,len,param1,param2,param3,completeCallback){
	SiteService.getArticles(siteTopicCode,offset,size,0,param1,param2,param3, function(arr){
		var items = 0;
		var htmlarea = "";
		for( var i=0;i<arr.length && i<size;i++){
			if(arr[i].text.length>len){
				htmlarea += "<li><div class='mcsTitle'><a target='_blank' style='color:"+arr[i].highlight+"' href='"+pageurl+"?mcCode="+arr[i].mcCode+"&searchExpr="+siteTopicCode+"'>"+arr[i].text.substring(0,len)+"...</a></div>";
			}else{
				htmlarea += "<li><div class='mcsTitle'><a target='_blank' style='color:"+arr[i].highlight+"' href='"+pageurl+"?mcCode="+arr[i].mcCode+"&searchExpr="+siteTopicCode+"'>"+arr[i].text+"</a></div>";
			}
			
			if( btime ){
				if( mcShortDateBefore(arr[i].createTime)=="red"){
					htmlarea += "<div class='mcsTime' style='color:red'>"+arr[i].createTime.substring(0,arr[i].createTime.length)+"</div>";
				}else{ 
					htmlarea += "<div class='mcsTime'>"+arr[i].createTime.substring(0,arr[i].createTime.length)+"</div>";
				}
			}
			htmlarea += "</li>"
		}
		$('#'+eleId).html(htmlarea);
		if( arr.length>0 ) items = arr[0].param1;
		if( completeCallback!=null ) completeCallback(items);
	});
}
function Gallery(eleId,siteTopicCode,offset,size,baseurl,len,param1,param2,param3,completeCallback){
	SiteService.getArticles(siteTopicCode,offset,size,1,null,null,null, function(arr){
		var items = 0;
		var htmlarea = "";
		for( var i=0;i<arr.length && i<size;i++){
			if(arr[i].text.length>len){
				htmlarea += "<li><a href='"+baseurl+"?mcCode="+arr[i].mcCode+"&searchExpr="+siteTopicCode+"'><img class='cmsThumb' src='"+param1+arr[i].thumbnail+"'><div class='cmsTitle'>"+arr[i].text.substring(0,len)+"...</div></a>";
			}else{
				htmlarea += "<li><a href='"+baseurl+"?mcCode="+arr[i].mcCode+"&searchExpr="+siteTopicCode+"'><img class='cmsThumb' src='"+param1+arr[i].thumbnail+"'><div class='cmsTitle'>"+arr[i].text+"</div></a>";
			}
			htmlarea += "</li>"
		}
		$('#'+eleId).html(htmlarea);
			
		if( arr.length>0 ) items = arr[0].param1;
		if( completeCallback!=null ) completeCallback(items);
	});
}
