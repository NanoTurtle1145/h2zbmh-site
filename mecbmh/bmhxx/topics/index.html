function ShowPagingArticleList(eleId,siteTopicCode,offset,size,pageurl,btime,len,param1,param2,param3,completeCallback){
	SiteService.getArticles(siteTopicCode,offset,size,0,param1,param2,param3, function(arr){
		var items = 0;
		var htmlarea = "";
		for( var i=0;i<arr.length && i<size;i++){
			if(arr[i].text.length>len){
				htmlarea += "<li><div class='mcsTitle'><a target='_blank' style='color:"+arr[i].highlight+"' href='"+pageurl+"?mcCode="+arr[i].mcCode+"&searchExpr="+siteTopicCode+"'>"+arr[i].text.substring(0,len)+"...</a></div>";
			}else{
				htmlarea += "<li><div class='mcsTitle'><a target='_blank' style='color:"+arr[i].highlight+"' href='"+pageurl+"?mcCode="+arr[i].mcCode+"&searchExpr="+siteTopicCode+"'>"+arr[i].text+"</a></div>";
			}
			
			if( btime ){

					htmlarea += "<div class='mcsTime' style='color:red'>"+arr[i].createTime.substring(0,arr[i].createTime.length)+"</div>";

					htmlarea += "<div class='mcsTime'>"+arr[i].createTime.substring(0,arr[i].createTime.length)+"</div>";
				}

		}
		$('#'+eleId).html(htmlarea);
		if( arr.length>0 ) items = arr[0].param1;
		if( completeCallback!=null ) completeCallback(items);
	});
}

function ShowArticles01(publicCode,divId,total){
	 SiteService.getArticle(publicCode,1,null,null,null, function(article){

					changeSize($(imgs.get(i)));		
			}	
			function changeSize(obj){ 
		    w=obj.width();  
		    h=obj.height();  
		    t=obj.attr("title");
		    src=obj.attr("src");  
		    obj.width(w>632?632:w);  
		    obj.height(w>632?(632/w)*h:h);  
		    obj.css("cursor","pointer");  
		    
			}    
			if($.browser.msie){  
			    //IE 6.0  
			    if($.browser.version==6.0){  
			        $("#body img").each(function(ind,ele){  
			           // ele.onreadystatechange =function(){  
			                if(ele.readyState == "complete"||ele.readyState=="loaded"){  
			                    changeSize($(this));  
			                }  
			            //}  
			        })  
			    }

			    else{  
			        $("#body img").each(function(){  
			            tempTimer=window.setInterval(function(ind,ele){  
			                if(ele.readyState=="complete"){  
			                    window.clearInterval(tempTimer);  
			                    changeSize($(this));  
			                }  
			                else{  
			                    return;  
			                }  
			            },200);  
			        })  
			    }    
			}  
			//FF,Chrome  
			else{  
			    $("#body img").each(function(ind,ele){  
			          
			        if(ele.complete==true){  
			            changeSize($(this));  
			        }  
			    })  
			}  
					
	});
