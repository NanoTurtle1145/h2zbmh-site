function showLinksSelect(eleId, siteTopicCode,completeCallback) {
	SiteService.getSiteLinks(siteTopicCode,'',100,null,null,null, function(res) {
		if (res.responseCode != 0) {
			return;
		}else{
			var htmlarea = '';
			var arr = $.parseJSON(res.responseText).rows;
			if(arr.length>0){
				htmlarea = '<a style="" id="'+eleId+'_a" href=\'javascript:linkCallback("'+eleId+'")\' >'+arr[0].field3+'</a>';
			}else{
				htmlarea = '<a style="" id="'+eleId+'_a" href=\'javascript:linkCallback("'+eleId+'")\' ></a>';
			}
			htmlarea += '<ul class="mcsLink" id="'+eleId+'_ul">';
			for ( var i = 0; i < arr.length; i++) {
				if(arr[i].field4 != null && arr[i].field4.length != 0){
					htmlarea += '<li onclick=\'$("#'+eleId+'_ul").toggle();window.open("'+arr[i].field4+'");\'>'+arr[i].field3+'</li>';
				}else{
				//	htmlarea += '<li onclick=\'$("#'+eleId+'_ul").toggle();\'>'+arr[i].field3+'</li>';
				}
			}
			htmlarea += '</ul>';
			
			$('#' + eleId).html(htmlarea);
		}
		
		if( completeCallback!=null ) completeCallback(eleId);
	});
}
function linkCallback(eleId){
	$("#"+eleId+"_ul").toggle();
	$(".mcsLink:not(#"+eleId+"_ul)").hide();
}
</script>

function ShowArticleList(eleId,siteTopicCode,pageurl,size,btime,len,completeCallback,imgNew){

		var htmlarea = "";

			var newFlag = false;
			var leng = 0;

				newFlag=true;
				leng = len;

				leng=len+2;

			}

			htmlarea += "</div>";
			/* if( btime ){

				}
			} */

		}

	});
