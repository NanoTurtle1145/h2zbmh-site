<script style="text/javascript">

var gItemsPerpage = 25;
var gCurrentPage = 0;

$(document).ready(function() {
	javascript:dwr.engine.setAsync(false);//ÉèÖÃÍ¬²½ÒÔ±ã¸øÇ°±ß±äÁ¿¸³Öµ
	
	loadByTopic( $("#siteTopicCode").val() );
	var pubCode = $("#sitePublicationCode").val();
	SiteService.getArticle(pubCode,1,null,null,null, function(article){
		$("#m_title").html(article.text);
		$("#fm_body").html(article.body);
		$("#_createTime").html(article.createTime);
		$("#m_author").html(article.pubAuthor);
		$("#_source").html(article.pubSource);
		
		
		
	}); 
	mcsShowTally("/bmhxx/article",pubCode,"tally");
	mcsShowNextArticle(pubCode,"_nextlink");
	mcsShowPreArticle(pubCode,"_prelink");
	showPublicationAttr("_path",pubCode,"fullname",null);
	
	SiteService.getPublicationAttach(pubCode,function(arr){
		var htmlarea = "";
		for( var i=0;i<arr.length;i++ ){
			htmlarea += "<span class='fj-span' style='font-weight: bold;'>附件</span>:";
			htmlarea+="<a href='/mecbmh"+arr[i].field4+"'>"+arr[i].field3+"</a><br/>";
		}
		$("#_attach").html(htmlarea);
	});
	
	
});	
function loadByTopic(siteTopicCode){
	SiteService.getSiteTopicAttr(siteTopicCode,"parent", function(res){
		if (res.responseCode != 0) {
			mcsShowSubtopicList("subtopics",siteTopicCode);
			showMainTopicName("maintopicname",siteTopicCode,"fullname",null);
			//showArticleList( siteTopicCode );
		}else{
			mcsShowSubtopicList("subtopics",res.responseText);
			showMainTopicName("maintopicname",siteTopicCode,"fullname",null);
		}
		//ÉèÖÃ×ó²à²Ëµ¥Ñ¡ÖÐÇ°ºÍÑ¡ÖÐºóµÄÑùÊ½
		$("#subtopics").find("li").click(function(){
			  
			  var topicCode = $(this).attr("rel");
			  
			  //showArticleList(topicCode);
			  
			  window.open("/mecbmh/bmhxx/topics?mcCode="+topicCode); 
			  
		});

		var b = false;
		$("#subtopics li").each(function() {

			if( $(this).attr("rel") == siteTopicCode ){
				b = true;
				//$(this).click();
				$("#subtopics").find("li").children("span").css("color","#4A4A4A");
			  $(this).children("span").css("color","#1E5C8D");
			}
		});
		
		
		if( !b ) $("#subtopics li").first().click();
	});	
}
function showPublicationAttr(eleId,pubCode,name,completeCallback){
	SiteService.getPublicationAttr(pubCode,name,function(resp){
		if (resp.responseCode == 0) {
			$('#'+eleId).html(resp.responseText);
			if( completeCallback!=null ) completeCallback();
		}
	});
}

function showMainTopicName(eleId,siteTopicCode,name,completeCallback){
	SiteService.getSiteTopicAttr(siteTopicCode,name, function(resp){
		if (resp.responseCode == 0) {
			$('#'+eleId).html(resp.responseText.substr(0,4));
			if( completeCallback!=null ) completeCallback();
		}
	});
}

</script>

<script type="text/javascript">

$(window).load(function(){

		imgs = $("#fm_body").find("img");
		for(var i=0;i<imgs.length;i++){
				changeSize($(imgs.get(i)));		
		}
		imgs.css("display","block");
		
		
});
function changeSize(obj){ 
    w=obj.width();  
    h=obj.height();  
    t=obj.attr("title");  
    src=obj.attr("src");  
    obj.width(w>838?838:w);  
    obj.height(w>838?(838/w)*h:h);  //632
    obj.css("cursor","pointer");  
    
}    
if($.browser.msie){  
    //IE 6.0  
    if($.browser.version==6.0){  
        $("#fm_body img").each(function(ind,ele){  
           // ele.onreadystatechange =function(){  
                if(ele.readyState == "complete"||ele.readyState=="loaded"){  
                    changeSize($(this));  
                }  
            //}  
        })  
    }  
    //IE 6.0ÒÔÉÏ  
    else{  
        $("#fm_body img").each(function(){  
            tempTimer=window.setInterval(function(ind,ele){  
                if(ele.readyState=="complete"){  
                    window.clearInterval(tempTimer);  
                    changeSize($(this));  
                }  
                else{  
                    return;  
                }  
            },200);  
        })  
    }    
}  
//FF,Chrome  
else{  
    $("#fm_body img").each(function(ind,ele){  
          
        if(ele.complete==true){  
            changeSize($(this));  
        }  
    })  
}  

</script>
