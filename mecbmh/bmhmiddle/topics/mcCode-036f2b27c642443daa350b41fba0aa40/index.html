		if(res.field13!=null && res.field13.length!=0){
			document.getElementById("topicimgbox3").src="/mecbmh"+res.field13;
			document.getElementById("topicimgbox3").style.display="block";
		}else{
			document.getElementById("topicimgbox3").style.display="none";
		}
	});
}
function showArticleList(topicCode){
	$("#selectedTopicCode").val(topicCode);

		var htmlarea = "<li>"+res.responseText+"</li>";
		$('#pathbar').html(htmlarea);
	});		
	pageClickCallback(0,null);
}
function articlesCompleteCallback(items){

}

function loadByTopic2(siteTopicCode){
	SiteService.getSiteTopicAttr(siteTopicCode,"parent", function(res){
		if (res.responseCode != 0) {
			alert("error");
		}else{
			$('#maintopicname').html(res.responseParam1);
			mcsShowSubtopicList("u_"+siteTopicCode,siteTopicCode,"subtopics02");
		}
		$("#u_"+siteTopicCode+ " li.subtopics02").removeClass("subtopics");
		$("#u_"+siteTopicCode+ " li.subtopics02").click(function(){
			$("#u_"+siteTopicCode+ " li.subtopics02").children("span").css("color","#737272");
			$(this).children("span").css("color","#925100");
			document.title=$(this).children("span").html();
			showArticleList( $(this).attr("rel") );
			setTopicImage($(this).attr("rel"));
		});
	});	
}


function mcsShowSubtopicList(eleId,parent,classname){
	SiteService.getSubTopics(parent, function(arr){
		var htmlarea="";
		for( var i=0;i<arr.length;i++){
			htmlarea +="<li rel='"+arr[i].id+"' class='"+classname+"'><span>"+arr[i].text+"</span></li>";
			htmlarea += "<ul id='u_"+arr[i].id+"' class='subtopics01'></ul>";
		}
		$('#'+eleId).html(htmlarea);
		$('#'+eleId).show("300");
	});	
}


function fancyboxImageCallBack(){
	$(".mcsFancybox").find("img").click(function() { 
		var thissrc = $(this).attr("src");
		var thisrel = $(this).attr("rel");
		$("#fancyblock").html("");
		var srcArray=new Array()
		var objs = $(".mcsFancybox").find("img");
		var htmlarea = "";
		for(var i=0;i<objs.length;i++){
			
			var result1 = objs[i].src.split("\/");
			var result2 = thissrc.split("\/");
			
			if(result1[result1.length-1] == result2[result2.length-1]){
				htmlarea += "<a id='fancyselected' class='fancybox' rel='gallery1' href='"+objs[i].src+"' title='"+$(objs[i]).attr("rel")+"'>";
				htmlarea += "<img src='"+objs[i].src+"' alt='' /></a>";
			}else{
				htmlarea += "<a class='fancybox' rel='gallery1' href='"+objs[i].src+"' title='"+$(objs[i]).attr("rel")+"'>";
				htmlarea += "<img src='"+objs[i].src+"' alt='' /></a>";
			}
			
		}
		$("#fancyblock").html(htmlarea);
		$("#fancyselected").click();
	
	});
}

function showMainTopicName(eleId,siteTopicCode,name,completeCallback){
	SiteService.getSiteTopicAttr(siteTopicCode,name, function(resp){
		if (resp.responseCode == 0) {
			$('#'+eleId).html(resp.responseText.substr(0,4));
			if( completeCallback!=null ) completeCallback();
		}
	});
}

function ShowPagingArticleList(eleId,siteTopicCode,offset,size,pageurl,btime,len,param1,param2,param3,completeCallback){
	SiteService.getArticles(siteTopicCode,offset,size,0,param1,param2,param3, function(arr){
		var items = 0;
		var htmlarea = "";
		for( var i=0;i<arr.length && i<size;i++){
			if(arr[i].text.length>len){
			htmlarea += "<li><div class='mcsTitle'><a target='_blank' style='color:"+arr[i].highlight+"' href='"+pageurl+"?mcCode="+arr[i].mcCode+"&searchExpr="+siteTopicCode+"'>"+"<span style='color:#b86f14;'>"+"["+arr[i].topicName+"]&nbsp;&nbsp;&nbsp;"+"</span>"+arr[i].text.substring(0,len)+"...</a></div>";
			}else{
				htmlarea += "<li><div class='mcsTitle'><a target='_blank' style='color:"+arr[i].highlight+"' href='"+pageurl+"?mcCode="+arr[i].mcCode+"&searchExpr="+siteTopicCode+"'>"+"<span style='color:#b86f14'>"+"["+arr[i].topicName+"]&nbsp;&nbsp;&nbsp;"+"</span>"+arr[i].text+"</a></div>";
			}
			
			if( btime ){
				if( mcShortDateBefore(arr[i].createTime)=="red"){
					htmlarea += "<div class='mcsTime' style='color:red'>"+arr[i].createTime.substring(0,arr[i].createTime.length)+"</div>";
				}else{ 
					htmlarea += "<div class='mcsTime'>"+arr[i].createTime.substring(0,arr[i].createTime.length)+"</div>";
				}
			}
			htmlarea += "</li>"
		}
		$('#'+eleId).html(htmlarea);
		if( arr.length>0 ) items = arr[0].param1;
		if( completeCallback!=null ) completeCallback(items);
	});


}

function StringBuffer() {
    this.__strings__ = new Array();
}
StringBuffer.prototype.append = function (str) {
    this.__strings__.push(str);
    return this;    //·½±ãÁ´Ê½²Ù×÷
}
StringBuffer.prototype.toString = function () {
    return this.__strings__.join("");
}
