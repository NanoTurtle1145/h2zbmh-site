<script type="text/javascript">

$(window).load(function(){

		imgs = $("#fm_body").find("img");
		for(var i=0;i<imgs.length;i++){

function changeSize(obj){ 
    w=obj.width();  
    h=obj.height();  
    t=obj.attr("title");  
    src=obj.attr("src");  
    obj.width(w>838?838:w);  
    obj.height(w>838?(838/w)*h:h);  
    obj.css("cursor","pointer");  
    
}    
if($.browser.msie){  
    //IE 6.0  
    if($.browser.version==6.0){  
        $("#fm_body img").each(function(ind,ele){  
           // ele.onreadystatechange =function(){  
                if(ele.readyState == "complete"||ele.readyState=="loaded"){  
                    changeSize($(this));  
                }  
            //}  
        })  
    }  
    //IE 6.0ÒÔÉÏ  
    else{  
        $("#fm_body img").each(function(){  
            tempTimer=window.setInterval(function(ind,ele){  
                if(ele.readyState=="complete"){  
                    window.clearInterval(tempTimer);  
                    changeSize($(this));  
                }  
                else{  
                    return;  
                }  
            },200);  
        })  
    }    
}  
//FF,Chrome  
else{  
    $("#fm_body img").each(function(ind,ele){  
          
        if(ele.complete==true){  
            changeSize($(this));  
        }  
    })  
}  

</script>
