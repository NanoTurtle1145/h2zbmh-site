<script style="text/javascript">

var gItemsPerpage = 25;
var gCurrentPage = 0;

$(document).ready(function() {
	javascript:dwr.engine.setAsync(false);//ÉèÖÃÍ¬²½ÒÔ±ã¸øÇ°±ß±äÁ¿¸³Öµ
	
	loadByTopic( $("#siteTopicCode").val() );
	
});	

function loadByTopic(siteTopicCode){
	SiteService.getSiteTopicAttr(siteTopicCode,"parent", function(res){
		if (res.responseCode != 0) {
			ShowSubtopicList("subtopics",siteTopicCode);
			showMainTopicName("maintopicname",siteTopicCode,"fullname",null);
			showArticleList( siteTopicCode );
		}else{
			ShowSubtopicList("subtopics",res.responseText);
			showMainTopicName("maintopicname",siteTopicCode,"fullname",null);
		}
		//ÉèÖÃ×ó²à²Ëµ¥Ñ¡ÖÐÇ°ºÍÑ¡ÖÐºóµÄÑùÊ½
		$("#subtopics").find("li").click(function(){
			  $("#subtopics").find("li").children("span").css("color","#4A4A4A");
			  $(this).children("span").css("color","#1E5C8D");
			  
			  var topicCode = $(this).attr("rel");
			  if(topicCode=='3347f23e689240259d9d20ca75c7d9fb'){
			  		showTopicName("topicname",topicCode,"fullname",null);
			  		$("#body").css("display","block");
			  		$("#_attach").css("display","block");
			  		$("#topicname").css("display","block"); 
			  		$(".list").css("display","none");
			  		$(".pagination-holder").css("display","none");
			  		$("#pathbar").css("display","none");
			  		$(".homepage_main_col2_top").css("border-bottom","1px dashed #AAA");	
			  }
			  if(topicCode=='3347f23e689240259d9d20ca75c7d9fb'){
			  		
			  		ShowArticles('1a4eb7cc56e44ea8a6fe9f33ae4bf98b','body',false);
			  }else{
			  		showTopicName("topicname",topicCode,"fullname",null);
			  		$("#body").css("display","none");
			  		$("#_attach").css("display","none");
			  		$("#topicname").css("display","none");
			  		$(".list").css("display","block");
			  		$(".pagination-holder").css("display","block");
			  		$("#pathbar").css("display","block");
			  		$(".homepage_main_col2_top").css("border-bottom","1px solid #D2D2D2");
			  		
			  		showArticleList(topicCode);
			  }
			 
			  
		});

		var b = false;
		$("#subtopics li").each(function() {

			if( $(this).attr("rel") == siteTopicCode ){
				b = true;
				$(this).click();
			}
		});
		
		
		if( !b ) $("#subtopics li").first().click();
	});	
}

function ShowSubtopicList(eleId,parent){
	SiteService.getSubTopics(parent, function(arr){
		var htmlarea="";
		for( var i=0;i<arr.length;i++){
			//if(arr[i].id!="bf286369a3c54c6eada5c818e213f602" && arr[i].id!="85945b41a80f46d2ad08f7c09195aa85" && arr[i].id!="e5bbe7ed673641b7a4146da722468aac" && arr[i].id!="d926bed651624d14b2b492d0588adab2")
				htmlarea +="<li rel='"+arr[i].id+"'><span>"+arr[i].text+"</span></li>";
			
		   // }
		}

		$('#'+eleId).html(htmlarea);
	});	
}
function showArticleList(topicCode){
	$("#selectedTopicCode").val(topicCode);
	SiteService.getSiteTopicAttr(topicCode,"fullname", function(res){
		var htmlarea = "<li>"+res.responseText+"</li>";
		$('#pathbar').html(htmlarea);
	});		
	pageClickCallback(0,null);
}
function articlesCompleteCallback(items){
		musShowPaging("light-pagination",items,gItemsPerpage,gCurrentPage,pageClickCallback);
	}

/* ¸Ä±äÎÄÕÂÁÐ±íÑùÊ½ */	
function pageClickCallback(pageNumber, event){
	gCurrentPage = pageNumber;
	
	var offset = gItemsPerpage * (pageNumber-1);
	if( offset<0 ) offset = 0;
	var topicCode = $("#selectedTopicCode").val();
	
	gItemsPerpage = 10;
	if( topicCode == '2d9ecea87fdb48daafb9268ab4ad2c05' ){		
		gItemsPerpage = 10;//Ã¿Ò³ÏÔÊ¾ÁÐ±íµÄÌõÊý
		$("#atclist1").removeClass().addClass("mcsGallery");
		//Í¼Æ¬Æ½ÆÌ
		mcsShowTeaserGallery("atclist1",topicCode,offset,gItemsPerpage,"article",150,"/mecbmh",null,null,articlesCompleteCallback);
	}else if( topicCode == '' ){
		$("#atclist1").removeClass().addClass("mcsList");
		mcsShowAttachmentList("atclist1",topicCode,offset,gItemsPerpage,"/mecbmh",true,30,articlesCompleteCallback);
	}else{
		$("#atclist1").removeClass().addClass("mcsList");
		ShowPagingArticleList("atclist1",topicCode,offset,gItemsPerpage,"article",true,30,null,null,null,articlesCompleteCallback);
		
	}		
}

function showMainTopicName(eleId,siteTopicCode,name,completeCallback){
	SiteService.getSiteTopicAttr(siteTopicCode,name, function(resp){
		if (resp.responseCode == 0) {
			$('#'+eleId).html(resp.responseText.substr(0,4));
			if( completeCallback!=null ) completeCallback();
		}
	});
}

function ShowPagingArticleList(eleId,siteTopicCode,offset,size,pageurl,btime,len,param1,param2,param3,completeCallback){
	SiteService.getArticles(siteTopicCode,offset,size,0,param1,param2,param3, function(arr){
		var items = 0;
		var htmlarea = "";
		for( var i=0;i<arr.length && i<size;i++){
			if(arr[i].text.length>len){
				htmlarea += "<li><div class='mcsTitle'><a target='_blank' style='color:"+arr[i].highlight+"' href='"+pageurl+"?mcCode="+arr[i].mcCode+"&searchExpr="+siteTopicCode+"'>"+arr[i].text.substring(0,len)+"...</a></div>";
			}else{
				htmlarea += "<li><div class='mcsTitle'><a target='_blank' style='color:"+arr[i].highlight+"' href='"+pageurl+"?mcCode="+arr[i].mcCode+"&searchExpr="+siteTopicCode+"'>"+arr[i].text+"</a></div>";
			}
			
			if( btime ){
				if( mcShortDateBefore(arr[i].createTime)=="red"){
					htmlarea += "<div class='mcsTime' style='color:red'>"+arr[i].createTime.substring(0,arr[i].createTime.length)+"</div>";
				}else{ 
					htmlarea += "<div class='mcsTime'>"+arr[i].createTime.substring(0,arr[i].createTime.length)+"</div>";
				}
			}
			htmlarea += "</li>"
		}
		$('#'+eleId).html(htmlarea);
		if( arr.length>0 ) items = arr[0].param1;
		if( completeCallback!=null ) completeCallback(items);
	});
}
function showTopicName(eleId,siteTopicCode,name,completeCallback){
	SiteService.getSiteTopicAttr(siteTopicCode,name, function(resp){
		if (resp.responseCode == 0) {
			$('#'+eleId).html(resp.responseText.substr(7));
			if( completeCallback!=null ) completeCallback();
		}
	});
}
function ShowArticles(publicCode,divId,total){
	 SiteService.getArticle(publicCode,1,null,null,null, function(article){

	 	if(total==true){		
				$("#aboutuscol").css("display","block");
	 			$("#m_title").html(article.text);
				$("#m_author").html(article.pubAuthor);
				$("#_source").html(article.pubSource);
	 		}
				
				$('#' + divId).html(article.body);	
				
			imgs = $("#body").find("img").css("width","632px");
			
			
			
					
	});
	SiteService.getPublicationAttach(publicCode,function(arr){
		var htmlarea = "";
		for( var i=0;i<arr.length;i++ ){
			htmlarea += "<span class='fj-span' style='font-weight: bold;'>附件：</span>";
			htmlarea+="<a href='/mecbmh"+arr[i].field4+"'>"+arr[i].field3+"</a><br/>";
		}
		$("#_attach").html(htmlarea);
	});
}
