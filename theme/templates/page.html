<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · 浙江省杭州二中白马湖学校</title>
<meta name="description" content="{{DESC}}">
<link rel="icon" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/assets/styles.css">
<style>
.pg-banner{background:linear-gradient(135deg,#0a4a3c,#0c8066 60%,#12987a);color:#fff;padding:52px 0 44px;position:relative;overflow:hidden}
.pg-banner::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:18px 18px;opacity:.5}
.pg-banner .wrap{position:relative;z-index:2;width:1200px;max-width:100%;margin:0 auto;padding:0 20px}
.pg-crumb{font-size:13px;color:#cdeee4;margin-bottom:14px}
.pg-crumb a{color:#cdeee4}
.pg-title{font-size:32px;font-weight:700;letter-spacing:.04em}
.pg-desc{margin-top:12px;font-size:14px;color:#d8f0e9}
.pg-wrap{display:grid;grid-template-columns:minmax(0,800px) 280px;gap:56px;justify-content:center;padding:44px 20px 70px;max-width:1200px;margin:0 auto}
.pg-body{font-size:16px;line-height:2.05;color:#333}
.pg-body p{margin:16px 0}
.pg-body h2{font-size:23px;color:#1a1a1a;margin:38px 0 14px;padding-left:12px;border-left:4px solid #0c8066;line-height:1.4;scroll-margin-top:20px}
.pg-body h3{font-size:18px;color:#1a1a1a;margin:28px 0 10px;scroll-margin-top:20px}
.pg-body ul,.pg-body ol{margin:14px 0;padding-left:24px}
.pg-body li{margin:6px 0}
.pg-body blockquote{margin:22px 0;padding:14px 20px;border-left:4px solid #0c8066;background:#f4faf8;color:#3a4a45;border-radius:0 6px 6px 0}
.pg-body table{border-collapse:collapse;width:100%;margin:20px 0;font-size:14.5px}
.pg-body th,.pg-body td{border:1px solid #e5e5e5;padding:10px 12px;text-align:left}
.pg-body th{background:#f6f9f8;color:#1a1a1a}
.pg-toc{position:sticky;top:24px;align-self:start;border:1px solid #ececec;border-radius:8px;padding:18px 20px;font-size:13.5px;background:#fcfdfc}
.pg-toc h4{font-size:14px;color:#1a1a1a;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #eee}
.pg-toc a{display:block;color:#666;padding:5px 0;line-height:1.5}
.pg-toc a:hover,.pg-toc a.on{color:#0c8066}
@media(max-width:1000px){.pg-wrap{grid-template-columns:1fr;padding:26px 16px 50px}.pg-toc{display:none}.pg-title{font-size:24px}}
</style></head><body>
<div class="topbar"><div class="wrap">
  <span class="item">联系我们：0571-86798900</span><span class="sep">|</span><span class="item">校长信箱：——</span>
</div></div>
<div class="hd"><div class="wrap" style="grid-template-columns:1fr auto 1fr">
  <div class="campus"><a href="/">总校</a><span class="sep">|</span><a href="/">小学部</a><span class="sep">|</span><a href="/">初中部</a></div>
  <a class="logo" href="/" style="color:inherit"><img class="logoimg" src="/assets/img/logo.png" alt="杭州二中白马湖学校"></a>
  <div class="empty"></div>
</div></div>
{{NAV}}
<div class="pg-banner"><div class="wrap">
  <div class="pg-crumb"><a href="/">首页</a> / {{TITLE}}</div>
  <h1 class="pg-title">{{TITLE}}</h1>
  <div class="pg-desc">{{DESC}}</div>
</div></div>
<div class="pg-wrap">
  <article class="pg-body" id="pagebody">
{{BODY}}
  </article>
  <aside class="pg-toc"><h4>本页目录</h4><div id="pgtoc"></div></aside>
</div>
<div class="foot"><div class="wrap"><span>© 浙江省杭州二中白马湖学校版权所有</span><span>|</span><span>备案证编号：浙ICP备15017196</span><span>|</span><a href="/privacy/">隐私政策</a></div></div>
<script>
(function(){
  var box=document.getElementById('pagebody');
  var heads=[].slice.call(box.querySelectorAll('h2,h3'));
  var toc=document.getElementById('pgtoc');
  heads.forEach(function(h,i){ h.id='h'+i; var a=document.createElement('a'); a.href='#'+h.id; a.textContent=h.textContent; if(h.tagName==='H3') a.className='lv3'; toc.appendChild(a); });
  if(!heads.length){ document.querySelector('.pg-toc').style.display='none'; }
  var links=[].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll',function(){
    var cur=null; heads.forEach(function(hd,i){ if(hd.getBoundingClientRect().top<120) cur=i; });
    links.forEach(function(a,i){ a.className=(i===cur?'on':(heads[i].tagName==='H3'?'lv3':'')); });
  },{passive:true});
})();
</script>
</body></html>
