<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{TITLE}} · 校园新闻 · 杭州二中白马湖学校</title>
<meta name="description" content="{{DESC}}">
{{COVER_META}}
<link rel="icon" href="/assets/img/favicon.png">
<link rel="stylesheet" href="/assets/styles.css">
<style>
.post-banner{position:relative;background:linear-gradient(135deg,#0a4a3c,#0c8066 60%,#12987a);color:#fff;padding:52px 0 44px;overflow:hidden}
.post-banner::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:18px 18px;opacity:.5}
.post-banner .wrap{position:relative;z-index:2;width:1200px;max-width:100%;margin:0 auto;padding:0 20px}
.post-crumb{font-size:13px;color:#cdeee4;margin-bottom:14px}
.post-crumb a{color:#cdeee4}
.post-title{font-size:30px;line-height:1.5;font-weight:700;letter-spacing:.02em;max-width:900px}
.post-meta{margin-top:16px;font-size:13px;color:#d8f0e9;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.post-meta span::before{content:"";display:inline-block;width:5px;height:5px;background:#9ae0cd;border-radius:50%;margin-right:7px;vertical-align:2px}
.post-wrap{display:grid;grid-template-columns:minmax(0,780px) 300px;gap:56px;justify-content:center;padding:44px 20px 70px;max-width:1200px;margin:0 auto}
.article-body{font-size:16px;line-height:2.05;color:#333}
.article-body p{margin:16px 0}
.article-body h2{font-size:24px;color:#1a1a1a;margin:40px 0 16px;padding-left:12px;border-left:4px solid #0c8066;line-height:1.4;scroll-margin-top:20px}
.article-body h3{font-size:19px;color:#1a1a1a;margin:30px 0 12px;line-height:1.5;scroll-margin-top:20px}
.article-body h4{font-size:17px;color:#1a1a1a;margin:24px 0 10px}
.article-body figure{margin:24px 0}
.article-body figure img{width:100%;height:auto;border-radius:8px;box-shadow:0 10px 28px -22px rgba(0,0,0,.5);display:block}
.article-body figcaption{text-align:center;font-size:13px;color:#888;margin-top:10px}
.article-body blockquote{margin:22px 0;padding:14px 20px;border-left:4px solid #0c8066;background:#f4faf8;color:#3a4a45;border-radius:0 6px 6px 0}
.article-body ul,.article-body ol{margin:14px 0;padding-left:24px}
.article-body li{margin:6px 0}
.article-body strong{color:#111}
.article-body code{background:#f4f4f4;border-radius:3px;padding:2px 6px;font-size:14px}
.post-tags{margin-top:34px;padding-top:22px;border-top:1px solid #eee;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:#888}
.post-tags a{border:1px solid #e0e0e0;border-radius:999px;padding:3px 12px;color:#0c8066;font-size:12.5px}
.post-tags a:hover{background:#e9f3f0;border-color:#bfe0d7}
.post-nav{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.post-nav a{border:1px solid #ececec;border-radius:8px;padding:16px 18px;color:#333;transition:.18s}
.post-nav a:hover{border-color:#bfe0d7;background:#f7fbfa}
.post-nav small{display:block;font-size:12px;color:#999;margin-bottom:6px}
.post-nav strong{font-size:14px;font-weight:600;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.post-nav .right{text-align:right}
.toc{position:sticky;top:24px;align-self:start;border:1px solid #ececec;border-radius:8px;padding:18px 20px;font-size:13.5px;background:#fcfdfc}
.toc h4{font-size:14px;color:#1a1a1a;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #eee}
.toc a{display:block;color:#666;padding:5px 0;line-height:1.5}
.toc a.lv3{padding-left:14px;font-size:12.5px}
.toc a:hover,.toc a.on{color:#0c8066}
.progress{position:fixed;left:0;top:0;height:3px;background:#0c8066;width:0;z-index:999}
@media(max-width:1000px){.post-wrap{grid-template-columns:1fr;padding:26px 16px 50px}.toc{display:none}.post-title{font-size:22px}}
</style>
</head><body>
<div class="progress" id="pg"></div>
<div class="topbar"><div class="wrap">
  <span class="item">联系我们：0571-86798900</span><span class="sep">|</span><span class="item">校长信箱：——</span>
  {{LANGDROP}}
  <div class="right"><input placeholder="搜索"><button>搜索</button></div>
</div></div>
<div class="hd"><div class="wrap" style="grid-template-columns:1fr auto 1fr">
  <div class="campus"><a href="/">总校</a><span class="sep">|</span><a href="/">小学部</a><span class="sep">|</span><a href="/">初中部</a></div>
  <a class="logo" href="/" style="color:inherit"><img class="logoimg" src="/assets/img/logo.png" alt="杭州二中白马湖学校"></a>
  <div class="empty"></div>
</div></div>
{{NAV}}
<div class="post-banner">
  <div class="wrap">
    <div class="post-crumb"><a href="/">首页</a> / <a href="/archives/">校园新闻</a> / 正文</div>
    <h1 class="post-title">{{TITLE}}</h1>
    <div class="post-meta"><span>{{DATE}}</span><span>{{CATEGORY}}</span><span>约 {{WORDS}} 字</span><span>杭州二中白马湖学校</span></div>
  </div>
</div>
<div class="post-wrap">
  <article>
    <div class="article-body" id="article">
{{BODY}}
    </div>
    <div class="post-tags">标签：{{TAGS}}</div>
    <div class="post-nav">{{PREV}}{{NEXT}}</div>
  </article>
  <aside class="toc"><h4>目录</h4><div id="toc"></div></aside>
</div>
<div class="foot"><div class="wrap"><span>© 浙江省杭州二中白马湖学校版权所有</span><span>|</span><span>备案证编号：浙ICP备15017196</span><span>|</span><a href="/archives/">新闻归档</a></div></div>
<script>
(function(){
  var box=document.getElementById('article');
  var heads=[].slice.call(box.querySelectorAll('h2,h3'));
  var toc=document.getElementById('toc');
  heads.forEach(function(h,i){
    var id='h'+i; h.id=id;
    var a=document.createElement('a'); a.href='#'+id; a.textContent=h.textContent;
    if(h.tagName==='H3') a.className='lv3';
    toc.appendChild(a);
  });
  if(!heads.length){ document.querySelector('.toc').style.display='none'; }
  var links=[].slice.call(toc.querySelectorAll('a'));
  window.addEventListener('scroll',function(){
    var h=document.documentElement;
    var pct=(h.scrollTop)/(h.scrollHeight-h.clientHeight)*100;
    document.getElementById('pg').style.width=pct+'%';
    var cur=null;
    heads.forEach(function(hd,i){ if(hd.getBoundingClientRect().top<120) cur=i; });
    links.forEach(function(a,i){ a.className=(i===cur?'on':(heads[i].tagName==='H3'?'lv3':'')); });
  },{passive:true});
  document.querySelectorAll('.article-body img').forEach(function(im){
    im.style.cursor='zoom-in';
    im.addEventListener('click',function(){ window.open(im.src,'_blank'); });
  });
})();
</script>
</body></html>
